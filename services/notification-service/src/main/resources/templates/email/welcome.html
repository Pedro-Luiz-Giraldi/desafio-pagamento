<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 32px;">
<div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">

  <div style="text-align: center; margin-bottom: 32px;">
    <span style="font-size: 22px; font-weight: 700; color: #0f9560;">Acabou o Mony</span>
    <p style="color: #6b7280; font-size: 13px; margin: 4px 0 0;">Gateway de Pagamentos</p>
  </div>

  <h2 style="font-size: 18px; color: #111827; margin: 0 0 8px;">Confirme sua conta</h2>
  <p style="color: #374151; margin: 0 0 24px;">
    Olá, <strong th:text="${fullName}">Usuário</strong>!<br/>
    Use o código abaixo para confirmar seu e-mail:
  </p>

  <div style="text-align: center; background: #f0fdf4; border: 2px dashed #0f9560; border-radius: 8px; padding: 24px 32px; margin: 0 0 24px;">
    <span th:text="${confirmationCode}" style="font-size: 40px; font-weight: 700; letter-spacing: 12px; color: #0f9560; font-family: monospace;">000000</span>
  </div>

  <p style="color: #6b7280; font-size: 13px; margin: 0;">
    Este código expira em <strong>15 minutos</strong>.<br/>
    Se você não criou esta conta, ignore este e-mail.
  </p>

  <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 32px 0 16px;"/>
  <p style="color: #9ca3af; font-size: 12px; margin: 0; text-align: center;">
    Atenciosamente, Equipe Acabou o Mony
  </p>
</div>
</body>
</html>
